name: Run Meal Scraper (哨兵 c)

on:
  schedule:
    # C 哨兵：精準卡在 A 與 B 的中間時段 (UTC 時間 02:19, 06:19, 10:19, 14:19, 18:19, 22:19)
    # 對應台灣時間：10:19, 14:19, 18:19, 22:19, 02:19, 06:19
    - cron: '19 2,6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  scrape_c:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5 小時 55 分鐘最終防線

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: |
          pip install -r requirements.txt

      - name: 執行高頻名額監控 (哨兵 B)
        env:
          PYTHONUNBUFFERED: "1"
          EIP_USER: ${{ secrets.EIP_USER }}
          EIP_PASS: ${{ secrets.EIP_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
