name: Run Meal Scraper

on:
  schedule:
    # 避開整點尖峰，改於 15 分觸發，每 4 小時無縫循環一輪
    # 對應台灣時間: 04:15, 08:15, 12:15, 16:15, 20:15, 00:15
    - cron: '15 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 270 # 限制單次最長 4.5 小時，確保與下一輪重疊交接

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: |
          pip install -r requirements.txt

      - name: 執行高頻名額監控
        env:
          PYTHONUNBUFFERED: "1"
          EIP_USER: ${{ secrets.EIP_USER }}
          EIP_PASS: ${{ secrets.EIP_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
