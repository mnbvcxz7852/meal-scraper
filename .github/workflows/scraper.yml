name: Run Meal Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: |
          pip install -r requirements.txt

      - name: 執行高頻名額監控
        env:
          EIP_USER: ${{ secrets.EIP_USER }}
          EIP_PASS: ${{ secrets.EIP_PASS }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: |
          python main.py

      - name: 上傳畫面截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshot
          path: screenshot_*.png
          if-no-files-found: ignore
