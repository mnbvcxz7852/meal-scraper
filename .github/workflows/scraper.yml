name: Run Meal Scraper

on:
  schedule:
    # 改為每 3 小時觸發一次 (避開整點與 15 分，改用冷門的 23 分)
    - cron: '23 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 拉高至 5 小時 50 分鐘作為最終防線

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: |
          pip install -r requirements.txt

      - name: 執行高頻名額監控
        env:
          PYTHONUNBUFFERED: "1"
          EIP_USER: ${{ secrets.EIP_USER }}
          EIP_PASS: ${{ secrets.EIP_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
