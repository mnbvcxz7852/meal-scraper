name: Run Meal Scraper (哨兵 A)

on:
  schedule:
    # A 哨兵：每 8 小時一班 (UTC 時間 00:15, 08:15, 16:15)
    # 對應台灣時間: 08:15, 16:15, 00:15 (每班跑 5 小時，至 13:15, 21:15, 05:15 退場)
    - cron: '37 0,8,16 * * *'
  workflow_dispatch:

jobs:
  scrape_a:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5 小時 50 分鐘最終防線

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: |
          pip install -r requirements.txt

      - name: 執行高頻名額監控 (哨兵 A)
        env:
          PYTHONUNBUFFERED: "1"
          EIP_USER: ${{ secrets.EIP_USER }}
          EIP_PASS: ${{ secrets.EIP_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
