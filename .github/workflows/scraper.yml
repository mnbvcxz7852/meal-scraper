name: Run Meal Scraper

on:
  workflow_dispatch: # 支援在網頁上手動點擊執行測試

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install -r requirements.txt

      - name: 執行測試抓取
        run: |
          python main.py
